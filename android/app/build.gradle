plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def getGitShortHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            if (System.getProperty('os.name').toLowerCase().contains('windows')) {
                commandLine 'cmd', '/c', 'git', 'rev-parse', '--short=7', 'HEAD'
            } else {
                commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
            }
            standardOutput = stdout
        }
        def hash = stdout.toString().trim()
        return (hash && !hash.isEmpty()) ? hash : "dev"
    } catch (Exception e) {
        try {
            def process = "git rev-parse --short=7 HEAD".execute([], project.rootDir)
            process.waitFor()
            def hash = process.text.trim()
            return (hash && !hash.isEmpty()) ? hash : "dev"
        } catch (Exception e2) {
            return "dev"
        }
    }
}

def getBuildTimestamp = { ->
    return new Date().format('yyyyMMdd-HHmm')
}

android {
    namespace = "com.ventspils.voiceassistant.ventspils_voice_assistant"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ventspils.voiceassistant.ventspils_voice_assistant"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        def baseVersion = variant.versionName
        def gitHash = getGitShortHash()
        def timeStamp = getBuildTimestamp()
        def customApkName = "rva-v${baseVersion}-${timeStamp}-${gitHash}.apk"

        variant.outputs.all { output ->
            outputFileName = customApkName
        }
        variant.assembleProvider.configure { assembleTask ->
            assembleTask.doLast {
                copy {
                    from "${layout.buildDirectory.asFile.get()}/outputs/apk/${variant.buildType.name}/${customApkName}"
                    into "${layout.buildDirectory.asFile.get()}/outputs/flutter-apk"
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
