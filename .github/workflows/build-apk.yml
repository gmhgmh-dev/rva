name: Build and Release APK

on:
  push:
    branches:
      - 'dev/v0.2.0'
      - 'main'
  pull_request:
    branches:
      - 'dev/v0.2.0'
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android CMake 3.22.1
        run: |
          echo "Installing CMake 3.22.1 for Android build..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, base64, subprocess, hashlib

          b64 = os.environ.get("KEYSTORE_BASE64", "").strip()
          key_alias = os.environ.get("KEY_ALIAS", "").strip()
          key_pwd = os.environ.get("KEY_PASSWORD", "").strip()
          store_pwd = os.environ.get("STORE_PASSWORD", "").strip()

          if b64:
              try:
                  raw_bytes = base64.b64decode(b64)
                  with open("android/app/upload-keystore.jks", "wb") as f:
                      f.write(raw_bytes)

                  sha = hashlib.sha256(raw_bytes).hexdigest()
                  print(f"Decoded keystore: {len(raw_bytes)} bytes, SHA256: {sha}")

                  # Inspect keystore to find alias
                  detected_alias = None
                  res_list = subprocess.run(
                      ["keytool", "-list", "-v", "-keystore", "android/app/upload-keystore.jks", "-storepass", store_pwd],
                      capture_output=True, text=True
                  )
                  for line in res_list.stdout.splitlines():
                      if "Alias name:" in line:
                          detected_alias = line.split(":", 1)[1].strip()
                          print(f"Found keystore alias: '{detected_alias}'")
                          break

                  final_alias = detected_alias or key_alias or "upload"
                  print(f"Testing alias '{final_alias}' with keytool...")

                  test_res = subprocess.run(
                      ["keytool", "-certreq", "-alias", final_alias, "-keystore", "android/app/upload-keystore.jks", "-storepass", store_pwd, "-keypass", key_pwd],
                      capture_output=True, text=True
                  )

                  if test_res.returncode == 0:
                      print("Keystore credentials verified successfully! Writing key.properties...")
                      with open("android/key.properties", "w", encoding="utf-8") as f:
                          f.write(f"storePassword={store_pwd}\n")
                          f.write(f"keyPassword={key_pwd}\n")
                          f.write(f"keyAlias={final_alias}\n")
                          f.write("storeFile=upload-keystore.jks\n")
                  else:
                      print("WARNING: Keystore credentials test failed:")
                      print(test_res.stderr or test_res.stdout)
                      print("Building with debug signing fallback to ensure APK is generated.")
                      if os.path.exists("android/key.properties"):
                          os.remove("android/key.properties")
              except Exception as e:
                  print(f"Error handling keystore: {e}")
                  if os.path.exists("android/key.properties"):
                      os.remove("android/key.properties")
          else:
              print("No KEYSTORE_BASE64 secret found, building with debug signing...")
              if os.path.exists("android/key.properties"):
                  os.remove("android/key.properties")
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
