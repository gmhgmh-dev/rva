name: Build and Release APK

on:
  push:
    branches:
      - 'dev/v0.2.0'
      - 'main'
  pull_request:
    branches:
      - 'dev/v0.2.0'
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android CMake 3.22.1
        run: |
          echo "Installing CMake 3.22.1 for Android build..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, base64

          b64 = os.environ.get("KEYSTORE_BASE64", "").strip()
          key_alias = os.environ.get("KEY_ALIAS", "")
          key_pwd = os.environ.get("KEY_PASSWORD", "")
          store_pwd = os.environ.get("STORE_PASSWORD", "")

          if b64:
              print("Decoding keystore...")
              raw_bytes = base64.b64decode(b64)
              with open("android/app/upload-keystore.jks", "wb") as f:
                  f.write(raw_bytes)
              
              with open("android/key.properties", "w", encoding="utf-8") as f:
                  f.write(f"storePassword={store_pwd}\n")
                  f.write(f"keyPassword={key_pwd}\n")
                  f.write(f"keyAlias={key_alias}\n")
                  f.write("storeFile=upload-keystore.jks\n")
              
              print(f"Keystore successfully configured ({len(raw_bytes)} bytes).")
          else:
              print("Keystore secret not found, building debug/unsigned...")
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
