name: Update Latvia PMTiles Map

on:
  schedule:
    # Runs at 03:00 UTC on the 1st day of every month
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Iemesls manuālai kartes atjaunināšanai'
        required: false
        default: 'Manuāla atjaunināšana'

permissions:
  contents: write

jobs:
  build-and-release-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Install Osmium Tool and Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool curl
          pipx install tippecanoe
          pipx ensurepath
          tippecanoe --version

      - name: Download and install go-pmtiles CLI
        run: |
          echo "Fetching latest go-pmtiles release..."
          LATEST_TAG=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          CLEAN_VERSION="${LATEST_TAG#v}"
          DOWNLOAD_URL="https://github.com/protomaps/go-pmtiles/releases/download/${LATEST_TAG}/go-pmtiles_${CLEAN_VERSION}_Linux_x86_64.tar.gz"
          curl -sL "$DOWNLOAD_URL" -o pmtiles.tar.gz
          tar -xzf pmtiles.tar.gz
          chmod +x pmtiles
          ./pmtiles version

      - name: Generate full Latvia PMTiles with maxspeed and road attributes
        id: custom_build
        continue-on-error: true
        run: |
          echo "Downloading latest Latvia OSM PBF from Geofabrik..."
          curl -sL "https://download.geofabrik.de/europe/latvia-latest.osm.pbf" -o latvia.osm.pbf
          ls -lh latvia.osm.pbf

          echo "Filtering drivable highways using osmium..."
          osmium tags-filter latvia.osm.pbf w/highway -o latvia_highways.osm.pbf
          ls -lh latvia_highways.osm.pbf

          echo "Exporting linestring geometries to GeoJSONSeq..."
          osmium export latvia_highways.osm.pbf --geometry-types=linestring -o latvia_roads.geojsonseq
          ls -lh latvia_roads.geojsonseq

          echo "Building PMTiles vector archive with Tippecanoe (layer: transportation, zoom 7-14)..."
          tippecanoe -o latvia.pmtiles \
            -l transportation \
            -z14 \
            -Z7 \
            --drop-densest-as-needed \
            --extend-zooms-if-still-dropping \
            latvia_roads.geojsonseq

          echo "Checking generated latvia.pmtiles..."
          if [ -s latvia.pmtiles ]; then
            echo "Successfully generated full custom latvia.pmtiles!"
            ls -lh latvia.pmtiles
            echo "build_success=true" >> $GITHUB_OUTPUT
          else
            echo "Failed to generate latvia.pmtiles"
            exit 1
          fi

      - name: Fallback to Protomaps daily extract if custom build failed
        if: steps.custom_build.outputs.build_success != 'true'
        run: |
          echo "Primary custom build was not completed. Falling back to Protomaps daily build extraction..."
          SUCCESS=0
          for i in 1 2 3 4; do
            BUILD_DATE=$(date -u -d "$i days ago" +%Y%m%d)
            echo "Trying Protomaps build for $BUILD_DATE..."
            if ./pmtiles extract "https://build.protomaps.com/${BUILD_DATE}.pmtiles" latvia.pmtiles --maxzoom=14 --bbox=20.97,55.67,28.24,58.08; then
              echo "Successfully extracted Latvia PMTiles from ${BUILD_DATE} build!"
              SUCCESS=1
              break
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Error: Both primary build and Protomaps fallback failed."
            exit 1
          fi
          ls -lh latvia.pmtiles

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latvijas PMTiles bezsaistes karte (${{ steps.date.outputs.date }})"
          body: |
            Automātiski sagatavota Latvijas OpenStreetMap PMTiles vektorkarte lietotnei RVA (Roads Voice Assistant).
            
            - **Atjaunināts:** ${{ steps.date.outputs.date }}
            - **Saturs:** Visi Latvijas ceļi un ielas ar pilniem `maxspeed`, `zone:maxspeed`, `oneway` un nosaukumu atribūtiem.
            - **Fails:** `latvia.pmtiles`
            - **Tiešā lejupielādes saite:** https://github.com/gmhgmh-dev/rva/releases/latest/download/latvia.pmtiles
          files: latvia.pmtiles
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
